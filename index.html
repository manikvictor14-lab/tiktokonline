<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Your Order</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
    font-family: Arial, sans-serif;
}

.invoice-form {
    width: 100%;
    max-width: 400px;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
}

h2 {
    text-align: center;
    color: #172554;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.4;
    margin: 0 0 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
}

.subtitle strong {
    color: #16a34a;
    font-size: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 20px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #172554;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    width: 100%;
    padding: 14px;
    background: #172554;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #263d7a;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .invoice-form {
        padding: 24px 20px;
    }
}
</style>
</head>

<body>

<div class="invoice-form">

    <h2>Register Your Order Now</h2>

    <p class="subtitle">
        Register your order for only <strong>$2</strong>
    </p>

    <form id="orderForm">

        <label for="nickname">Nickname</label>
        <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="Enter your nickname"
            required
        >

        <label for="quantity">Quantity</label>
        <input
            type="number"
            id="quantity"
            name="quantity"
            placeholder="Enter quantity"
            min="1"
            required
        >

        <label for="address">delivery address</label>
        <textarea
            id="address"
            name="address"
            placeholder="Enter your address"
            required
        ></textarea>

        <button type="submit">Submit Now</button>

    </form>

</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();

    window.location.href = "https://myreferraldiscount.blog/";
});
</script>

</body>
</html>
